<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Importer</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e3de;
    --accent: #2f5bd3; --on-accent: #fff; --ok: #1f7a3d; --ok-bg: #e6f4ea; --bad: #b3261e; --bad-bg: #fce8e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #20201e; --text: #ecece8; --muted: #9a9a94; --line: #34342f;
      --accent: #7a9bff; --on-accent: #0d1633; --ok: #6fd28f; --ok-bg: #18301f; --bad: #ff8a80; --bad-bg: #3a1c1a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 1.35rem; margin: 0; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; }
  .pill { font-size: .8rem; padding: 3px 10px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); white-space: nowrap; }
  .pill.ok::before { content: "● "; color: var(--ok); }
  .pill.bad::before { content: "● "; color: var(--bad); }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .muted { color: var(--muted); font-size: .9rem; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer;
           background: var(--accent); color: var(--on-accent); }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: default; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 12px 0 6px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .4s; }
  .bar.indeterminate > div { width: 30%; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .steps span { font-size: .78rem; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .steps span.done { color: var(--ok); border-color: var(--ok); }
  .steps span.now { color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .result.ok { background: var(--ok-bg); border-color: transparent; }
  .result.bad { background: var(--bad-bg); border-color: transparent; }
  .result .big { font-size: 1.15rem; font-weight: 650; }
  .result.ok .big { color: var(--ok); }
  .result.bad .big { color: var(--bad); }
  ul.files { margin: 8px 0 0; padding-left: 18px; font: .82rem/1.5 ui-monospace, monospace; max-height: 220px; overflow: auto; }
  details { margin-top: 10px; }
  pre { font: .75rem/1.4 ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; max-height: 260px; overflow: auto;
        background: var(--bg); padding: 8px; border-radius: 6px; }
  .hist { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; font-size: .9rem; }
  .empty { text-align: center; padding: 28px 16px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Photo Importer</h1>
    <span id="immich" class="pill">Immich…</span>
  </header>
  <div id="job"></div>
  <h2>Cards</h2>
  <div id="cards"><div class="box muted">Loading…</div></div>
  <h2>Recent imports</h2>
  <div id="history" class="box muted">—</div>
</main>
<script>
const STEPS = ["scanning", "hashing", "checking", "uploading", "verifying"];
const STEP_LABEL = {scanning: "List", hashing: "Fingerprint", checking: "Check", uploading: "Upload", verifying: "Verify"};
let state = {cards: [], job: null};
let pollTimer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gb = b => b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : (b / 1e6).toFixed(0) + " MB";
const day = t => new Date(t * 1000).toLocaleDateString(undefined, {month: "short", day: "numeric", year: "numeric"});
const when = t => new Date(t * 1000).toLocaleString(undefined, {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});
const mins = s => s < 90 ? Math.round(s) + "s" : Math.round(s / 60) + " min";
const running = () => state.job && state.job.status === "running";

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => null);
  if (!r.ok) throw new Error((body && body.detail) || r.statusText);
  return body;
}

async function loadOverview() {
  try {
    const o = await api("/api/overview");
    state.cards = o.cards; state.job = o.job;
    const im = $("immich");
    im.className = "pill " + (o.immich.ok ? "ok" : "bad");
    im.textContent = o.immich.ok ? "Immich connected" : "Immich unreachable";
    im.title = o.immich.ok ? `${o.immich.url} as ${o.immich.user}` : o.immich.error;
    renderCards(); renderJob(); renderHistory(o.history);
    if (!o.immich.ok) $("job").insertAdjacentHTML("afterbegin",
      `<div class="box result bad"><div class="big">Can't talk to Immich</div><div class="muted">${esc(o.immich.error)}</div></div>`);
    if (running()) startPolling();
  } catch (e) {
    $("cards").innerHTML = `<div class="box">Couldn't load: ${esc(e.message)}</div>`;
  }
}

function renderCards() {
  if (!state.cards.length) {
    $("cards").innerHTML = `<div class="box empty"><div>No card found.</div>
      <div class="muted" style="margin:6px 0 14px">Insert an SD card into the NUC, then refresh.</div>
      <button class="secondary" onclick="loadOverview()">Refresh</button></div>`;
    return;
  }
  $("cards").innerHTML = state.cards.map(c => {
    const range = c.first ? (day(c.first) === day(c.last) ? day(c.first) : `${day(c.first)} – ${day(c.last)}`) : "";
    return `<div class="box row"><div><strong>${c.files.toLocaleString()} files</strong> · ${gb(c.bytes)}
      <div class="muted">${esc(range)} · slot ${esc(c.name)}</div></div>
      <button ${running() ? "disabled" : ""} onclick="startImport('${esc(c.name)}')">Import</button></div>`;
  }).join("");
}

function renderJob() {
  const j = state.job;
  if (!j) { $("job").innerHTML = ""; return; }
  const elapsed = ((j.finished || Date.now() / 1000) - j.started);
  if (j.status === "running") {
    const idx = STEPS.indexOf(j.phase);
    const steps = STEPS.map((s, i) => `<span class="${i < idx ? "done" : i === idx ? "now" : ""}">${STEP_LABEL[s]}</span>`).join("");
    const pct = j.bytes ? Math.min(100, 100 * j.hashed_bytes / j.bytes) : 0;
    let detail = "", bar = `<div class="bar indeterminate"><div></div></div>`;
    if (j.phase === "hashing") {
      const rate = j.hashed_bytes / Math.max(1, elapsed);
      const left = rate > 0 ? (j.bytes - j.hashed_bytes) / rate : 0;
      bar = `<div class="bar"><div style="width:${pct}%"></div></div>`;
      detail = `${gb(j.hashed_bytes)} of ${gb(j.bytes)} · about ${mins(left)} left`;
    } else if (j.phase === "uploading") {
      detail = `${j.already.toLocaleString()} already in Immich · ${j.to_upload.toLocaleString()} uploading`;
    }
    const out = j.phase === "uploading" && j.uploader_output.length
      ? `<details><summary class="muted">Uploader output</summary><pre>${esc(j.uploader_output.slice(-15).join("\n"))}</pre></details>` : "";
    $("job").innerHTML = `<div class="box"><div class="row"><strong>Importing…</strong><span class="muted">${mins(elapsed)}</span></div>
      <div class="steps">${steps}</div>${bar}<div>${esc(j.message)}</div><div class="muted">${detail}</div>${out}</div>`;
    return;
  }
  const ok = j.status === "success";
  const cardStillIn = state.cards.some(c => c.name === j.card);
  const missing = j.missing.length
    ? `<div style="margin-top:10px"><strong>Not in Immich:</strong><ul class="files">${j.missing.slice(0, 200).map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>` : "";
  const out = !ok && j.uploader_output.length
    ? `<details><summary class="muted">Uploader output</summary><pre>${esc(j.uploader_output.join("\n"))}</pre></details>` : "";
  const sub = ok
    ? `${j.already.toLocaleString()} were already there, ${(j.files - j.already).toLocaleString()} uploaded now. You can remove the card.`
    : `Nothing was deleted or changed on the card.${cardStillIn ? " Try again; files already in Immich are skipped." : ""}`;
  $("job").innerHTML = `<div class="box result ${ok ? "ok" : "bad"}">
    <div class="big">${ok ? "✓ " : "✗ "}${esc(j.message)}</div>
    <div class="muted" style="margin-top:4px">${sub} · ${mins(elapsed)}</div>${missing}${out}
    ${!ok && cardStillIn ? `<div style="margin-top:12px"><button onclick="startImport('${esc(j.card)}')">Try again</button></div>` : ""}</div>`;
}

function renderHistory(h) {
  if (!h.length) { $("history").textContent = "No imports yet."; return; }
  $("history").className = "box";
  $("history").innerHTML = `<div class="hist">${h.map(r => `
    <span>${r.status === "success" ? "✓" : "✗"}</span>
    <span>${when(r.started)} · ${r.files.toLocaleString()} files${r.status === "success" ? "" : ` · <span style="color:var(--bad)">${esc(r.message)}</span>`}</span>
    <span class="muted">${r.status === "success" ? (r.files - r.already).toLocaleString() + " new" : ""}</span>`).join("")}</div>`;
}

async function startImport(card) {
  try {
    state.job = await api("/api/import", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({card})});
    renderJob(); renderCards(); startPolling();
  } catch (e) { alert(e.message); loadOverview(); }
}

// Only polls while an import is running AND this tab is visible.
function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    if (document.hidden) return;
    try { state.job = await api("/api/job"); } catch { return; }
    renderJob();
    if (!running()) { clearInterval(pollTimer); pollTimer = null; loadOverview(); }
  }, 1500);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadOverview(); });
loadOverview();
</script>
</body>
</html>
